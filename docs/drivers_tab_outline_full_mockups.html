<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drivers tab — outline options 1 / 3 / 4 (all themes)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 24px 64px;
      background: #0e0e12; color: #e7e7ec;
      font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .lead { color: #9a9aa6; max-width: 1000px; line-height: 1.55; margin-bottom: 20px; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .nav a {
      color: #6aa8ff; text-decoration: none; font-size: 12px;
      padding: 6px 12px; border: 1px solid #3a3a44; border-radius: 6px; background: #26262d;
    }
    .section { margin-bottom: 48px; }
    .section-head { margin-bottom: 14px; }
    .section-head h2 { font-size: 17px; margin: 0 0 6px; }
    .section-head p { margin: 0; color: #9a9aa6; font-size: 13px; max-width: 900px; line-height: 1.5; }
    .pill {
      display: inline-block; font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px; margin-right: 8px;
      border: 1px solid #3a3a44; color: #9a9aa6;
    }
    .pill.rec { border-color: #2f81f7; color: #6aa8ff; }
    .row3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 1320px;
    }
    @media (max-width: 1100px) { .row3 { grid-template-columns: 1fr; } }
    .frame-label {
      font-size: 12px; font-weight: 600; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .frame-label .theme-tag {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
    }

    /* ——— full window ——— */
    .win {
      width: 100%; max-width: 420px; height: 520px;
      display: flex; flex-direction: column;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
      font-size: 11px;
      --body: 11px; --title: 12px;
    }
    .win-bar {
      padding: 4px 10px; font-size: 10px;
      display: flex; justify-content: space-between; flex-shrink: 0;
    }
    .menu { padding: 2px 8px; font-size: 10px; flex-shrink: 0; }
    .menu span { margin-right: 10px; }
    .tabs { display: flex; gap: 2px; padding: 4px 8px 0; flex-shrink: 0; }
    .tab {
      padding: 4px 8px; font-size: 10px;
      border-radius: 5px 5px 0 0;
    }
    .content { flex: 1; min-height: 0; padding: 0 8px 4px; display: flex; flex-direction: column; }
    .catalog-card {
      flex: 1; min-height: 0; border-radius: 8px;
      padding: 8px 10px; display: flex; flex-direction: column;
    }
    .card-t { font-size: var(--title); font-weight: 600; margin-bottom: 2px; flex-shrink: 0; }
    .status-line { font-size: 9px; margin-bottom: 6px; flex-shrink: 0; line-height: 1.35; }
    .prog {
      height: 20px; border-radius: 4px; margin-bottom: 6px; flex-shrink: 0;
      display: flex; align-items: center; padding: 0 8px; font-size: 9px;
    }
    .prog-bar { flex: 1; height: 6px; border-radius: 3px; margin-left: 6px; overflow: hidden; }
    .prog-bar i { display: block; height: 100%; width: 72%; }

    /* chrome variants */
    .filter-tray { border-radius: 6px; padding: 6px; margin-bottom: 6px; flex-shrink: 0; }
    .filter-row { display: flex; gap: 5px; flex-shrink: 0; }
    .combo, .inp, .fbtn {
      height: 28px; border-radius: 5px; display: flex; align-items: center;
      font-size: 10px; padding: 0 8px;
    }
    .combo { min-width: 88px; justify-content: space-between; flex-shrink: 0; }
    .inp { flex: 1; min-width: 0; }
    .fbtn { flex-shrink: 0; white-space: nowrap; }
    .fbtn.primary { font-weight: 600; }

    .split-col { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .list-pane { flex: 1.1; min-height: 0; display: flex; flex-direction: column; }
    .tbl {
      flex: 1; min-height: 0; border-radius: 6px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .tbl-h, .tbl-r {
      display: grid; grid-template-columns: 28px 24px 1fr 72px 52px;
      align-items: center; padding: 0 3px; font-size: 10px;
    }
    .tbl-h { height: 26px; flex-shrink: 0; font-weight: 600; }
    .tbl-body { flex: 1; overflow: hidden; }
    .tbl-r { height: 30px; }
    .tbl-r.dual { height: 38px; }
    .tbl-r .inst { font-size: 9px; line-height: 1.25; white-space: pre-line; }
    .st-u { font-weight: 600; }
    .ico { width: 18px; height: 18px; border-radius: 3px; margin: auto; font-size: 7px; display: grid; place-items: center; }
    .chk { width: 12px; height: 12px; border-radius: 2px; margin: auto; }

    .splitter { height: 5px; flex-shrink: 0; border-radius: 2px; margin: 3px 0; }
    .insp { flex: 0.85; min-height: 0; border-radius: 6px; padding: 6px 8px; overflow: hidden; }
    .insp h4 { margin: 0 0 3px; font-size: 11px; font-weight: 600; }
    .insp .sub { font-size: 9px; line-height: 1.35; margin-bottom: 4px; }
    .pkg-t { font-size: 10px; font-weight: 600; margin: 4px 0 2px; }
    .pkg-r {
      display: grid; grid-template-columns: 44px 1fr 48px;
      padding: 3px 4px; font-size: 9px;
    }
    .cmp-n { font-weight: 600; }

    .btm-bar {
      flex-shrink: 0; display: flex; gap: 6px; flex-wrap: wrap;
      padding: 5px 8px; align-items: center;
    }
    .btm-bar .btn { font-size: 10px; padding: 4px 10px; border-radius: 5px; }
    .btm-bar .sp { flex: 1; }
  </style>
</head>
<body>
  <h1>Drivers tab — full renders (options 1 · 3 · 4)</h1>
  <p class="lead">
    Nine full-window mocks: each outline style × Night / Day / Manly. Banner hidden (catalog tab).
    Combo &amp; search use <strong>clean Fusion-style edges</strong> (no white bottom line); difference is
    surrounding chrome only.
  </p>

  <nav class="nav">
    <a href="#opt1">Option 1</a>
    <a href="#opt3">Option 3 ★</a>
    <a href="#opt4">Option 4</a>
  </nav>

  <div id="root"></div>

  <script>
    const THEMES = {
      night: {
        label: "Night", BG: "#1e1e23", CARD: "#26262d", CARD_ALT: "#2c2c34", BORDER: "#3a3a44",
        TEXT: "#e7e7ec", MUTED: "#9a9aa6", ACCENT: "#2f81f7", TABLE_SELECTION: "#1e4a7a",
        PRIMARY_HOVER: "#4593ff", UPDATE_BG: "rgba(63,185,80,.14)", OUTDATED_BG: "#3a3420",
        GOLD: "#d8a000", GREEN: "#3fb950", tagBg: "#1e4a7a", tagFg: "#6aa8ff",
      },
      day: {
        label: "Day", BG: "#eef0f4", CARD: "#ffffff", CARD_ALT: "#f4f5f8", BORDER: "#cdd0d8",
        TEXT: "#121218", MUTED: "#484852", ACCENT: "#2563eb", TABLE_SELECTION: "#bfdbfe",
        PRIMARY_HOVER: "#1d4ed8", UPDATE_BG: "rgba(21,128,61,.1)", OUTDATED_BG: "#fef3c7",
        GOLD: "#b45309", GREEN: "#15803d", tagBg: "#dbeafe", tagFg: "#1d4ed8",
      },
      manly: {
        label: "Manly", BG: "#ebe4f4", CARD: "#faf8ff", CARD_ALT: "#f0eaf8", BORDER: "#d4c4e8",
        TEXT: "#362f45", MUTED: "#5f5670", ACCENT: "#8570f0", TABLE_SELECTION: "#c4d8ff",
        PRIMARY_HOVER: "#6b58d8", UPDATE_BG: "rgba(133,112,240,.12)", OUTDATED_BG: "#fef3c7",
        GOLD: "#b45309", GREEN: "#15803d", tagBg: "#ede9fe", tagFg: "#6b58d8",
      },
    };

    const OPTIONS = [
      {
        id: "opt1", anchor: "opt1", num: "1", title: "Theme border restore",
        desc: "Uniform 1px BORDER on card, filters, table, inspector, buttons, splitter. Simplest restore.",
        rec: false,
        chrome: { tray: false, accentCombo: false, accentSplit: false, accentHead: false, inset: false },
      },
      {
        id: "opt3", anchor: "opt3", num: "3", title: "Filter tray + full grid",
        desc: "Filter row grouped in CARD_ALT tray; full table grid + splitter + bordered detail panes.",
        rec: true,
        chrome: { tray: true, accentCombo: false, accentSplit: false, accentHead: false, inset: false },
      },
      {
        id: "opt4", anchor: "opt4", num: "4", title: "Accent highlights",
        desc: "Same as 3, plus accent border on dropdown, accent underline on table header, accent splitter.",
        rec: false,
        chrome: { tray: true, accentCombo: true, accentSplit: true, accentHead: true, inset: false },
      },
    ];

    function t(th, k) { return th[k]; }

    function buildWin(themeKey, opt) {
      const th = THEMES[themeKey];
      const c = opt.chrome;
      const cardBorder = `1px solid ${t(th,"BORDER")}`;
      const comboBorder = c.accentCombo
        ? `1px solid ${t(th,"ACCENT")}` : `1px solid ${t(th,"BORDER")}`;
      const comboShadow = c.accentCombo ? `0 0 0 1px ${t(th,"ACCENT")}33` : "none";
      const filterInner = c.tray ? "" : `
        <div class="filter-row">
          ${filterControls(th, comboBorder, comboShadow, cardBorder)}
        </div>`;
      const filterTray = c.tray ? `
        <div class="filter-tray" style="background:${t(th,"CARD_ALT")};border:${cardBorder}">
          <div class="filter-row">${filterControls(th, comboBorder, comboShadow, cardBorder)}</div>
        </div>` : filterInner;

      const splitBg = c.accentSplit ? t(th,"ACCENT") + "88" : t(th,"BORDER");
      const headExtra = c.accentHead ? `box-shadow:inset 0 -2px 0 ${t(th,"ACCENT")}55;` : "";

      return `
        <div class="win" style="background:${t(th,"BG")};color:${t(th,"TEXT")};border:1px solid ${t(th,"BORDER")}">
          <div class="win-bar" style="background:${t(th,"CARD_ALT")};border-bottom:1px solid ${t(th,"BORDER")};color:${t(th,"MUTED")}">
            <span>BSOD Analyzer v6.4.10</span><span>—</span>
          </div>
          <div class="menu" style="border-bottom:1px solid ${t(th,"BORDER")};color:${t(th,"MUTED")}">
            <span>File</span><span>View</span><span>Tools</span><span>Help</span>
          </div>
          <div class="tabs">
            ${["Summary","Action Plan","Crash Details","System","Drivers","Firmware","Advanced"].map(tab =>
              `<span class="tab" style="background:${t(th,"CARD")};border:1px solid ${t(th,"BORDER")};color:${tab==="Drivers"?t(th,"TEXT"):t(th,"MUTED")};${tab==="Drivers"?`border-bottom:2px solid ${t(th,"ACCENT")}`:""}">${tab}</span>`
            ).join("")}
          </div>
          <div class="content">
            <div class="catalog-card" style="background:${t(th,"CARD")};border:${cardBorder}">
              <div class="card-t">Driver updates</div>
              <div class="status-line" style="color:${t(th,"MUTED")}">3 device(s) · showing 3 of 154 · 3 update(s) · portable · session list loaded · checked 154 · 3 update(s) found · full scan</div>
              <div class="prog" style="background:${t(th,"BG")};border:1px solid ${t(th,"BORDER")};color:${t(th,"MUTED")}">
                <span>Driver inventory</span>
                <div class="prog-bar" style="background:${t(th,"CARD_ALT")}"><i style="background:${t(th,"ACCENT")}"></i></div>
              </div>
              ${filterTray}
              <div class="split-col">
                <div class="list-pane">
                  <div class="tbl" style="background:${t(th,"CARD_ALT")};border:${cardBorder}">
                    <div class="tbl-h" style="background:${t(th,"CARD")};color:${t(th,"MUTED")};border-bottom:1px solid ${t(th,"BORDER")};${headExtra}">
                      <span style="border-right:1px solid ${t(th,"BORDER")}"></span>
                      <span style="border-right:1px solid ${t(th,"BORDER")}">☐</span>
                      <span style="border-right:1px solid ${t(th,"BORDER")}">Device</span>
                      <span style="border-right:1px solid ${t(th,"BORDER")}">Installed</span>
                      <span>Status</span>
                    </div>
                    <div class="tbl-body">
                      <div class="tbl-r sel" style="background:${t(th,"TABLE_SELECTION")};border-bottom:1px solid ${t(th,"BORDER")}">
                        <span class="ico" style="background:#76b900;color:#fff;border:1px solid ${t(th,"BORDER")}">NV</span>
                        <span class="chk" style="background:${t(th,"ACCENT")};border:1px solid ${t(th,"PRIMARY_HOVER")}"></span>
                        <span style="border-right:1px solid ${t(th,"BORDER")}padding-right:4px">NVIDIA GeForce RTX 3070 Ti Laptop GPU</span>
                        <span class="inst" style="border-right:1px solid ${t(th,"BORDER")};color:${t(th,"MUTED")}">32.0.16.1047\n2025-03-14</span>
                        <span class="st-u" style="color:${t(th,"ACCENT")}">Update</span>
                      </div>
                      <div class="tbl-r dual" style="background:${t(th,"OUTDATED_BG")};border-bottom:1px solid ${t(th,"BORDER")};color:${t(th,"GOLD")}">
                        <span class="ico" style="background:#0066cc;color:#fff;border:1px solid ${t(th,"BORDER")}">RT</span>
                        <span class="chk" style="background:${t(th,"ACCENT")};border:1px solid ${t(th,"PRIMARY_HOVER")}"></span>
                        <span style="border-right:1px solid ${t(th,"BORDER")}">Realtek Audio</span>
                        <span class="inst" style="border-right:1px solid ${t(th,"BORDER")}">6.0.9868.1\n2025-10-22</span>
                        <span class="st-u">Update</span>
                      </div>
                      <div class="tbl-r dual" style="background:${t(th,"OUTDATED_BG")};border-bottom:1px solid ${t(th,"BORDER")};color:${t(th,"GOLD")}">
                        <span class="ico" style="background:#0066cc;color:#fff;border:1px solid ${t(th,"BORDER")}">RT</span>
                        <span class="chk" style="background:${t(th,"ACCENT")};border:1px solid ${t(th,"PRIMARY_HOVER")}"></span>
                        <span style="border-right:1px solid ${t(th,"BORDER")}">Realtek Gaming 2.5GbE…</span>
                        <span class="inst" style="border-right:1px solid ${t(th,"BORDER")}">10.72.524.2024\n2024-11-12</span>
                        <span class="st-u">Update</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="splitter" style="background:${splitBg}"></div>
                <div class="insp" style="background:${t(th,"CARD_ALT")};border:${cardBorder}">
                  <h4>NVIDIA GeForce RTX 3070 Ti Laptop GPU</h4>
                  <div class="sub" style="color:${t(th,"MUTED")}">Installed 32.0.16.1047 · Branch OEM-D · Catalog checked</div>
                  <div class="pkg-t">Available packages</div>
                  <div class="pkg-r" style="border-bottom:1px solid ${t(th,"BORDER")};color:${t(th,"MUTED")}">
                    <span>Manufacturer</span><span>32.0.16.1213 · 2026-07-07</span><span class="cmp-n" style="color:${t(th,"GREEN")}">Newer</span>
                  </div>
                  <div class="pkg-r" style="color:${t(th,"MUTED")}">
                    <span>Microsoft</span><span>32.0.15.9144 · catalog</span><span>Same</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="btm-bar" style="background:${t(th,"CARD_ALT")};border-top:1px solid ${t(th,"BORDER")}">
            <span class="btn primary" style="background:${t(th,"ACCENT")};border:1px solid ${t(th,"ACCENT")};color:#fff">Run Analysis</span>
            <span class="btn" style="background:${t(th,"CARD")};border:1px solid ${t(th,"BORDER")};color:${t(th,"TEXT")}">Search for updates</span>
            <span class="btn" style="background:${t(th,"CARD")};border:1px solid ${t(th,"BORDER")};color:${t(th,"TEXT")}">Export Report</span>
            <span class="sp"></span>
            <span class="btn" style="background:${t(th,"ACCENT")};border:1px solid ${t(th,"ACCENT")};color:#fff">Download / open page</span>
            <span class="btn" style="background:${t(th,"CARD")};border:1px solid ${t(th,"BORDER")};color:${t(th,"TEXT")}">Install package</span>
          </div>
        </div>`;
    }

    function filterControls(th, comboBorder, comboShadow, cardBorder) {
      return `
        <div class="combo" style="background:${t(th,"CARD")};border:${comboBorder};box-shadow:${comboShadow};color:${t(th,"TEXT")}">Updates available <span style="opacity:.5">▼</span></div>
        <div class="inp" style="background:${t(th,"CARD_ALT")};border:1px solid ${t(th,"BORDER")};color:${t(th,"MUTED")}">Search by name…</div>
        <div class="fbtn" style="background:${t(th,"CARD_ALT")};border:${cardBorder};color:${t(th,"TEXT")}">Load devices</div>
        <div class="fbtn primary" style="background:${t(th,"ACCENT")};border:1px solid ${t(th,"ACCENT")};color:#fff">Search for updates</div>`;
    }

    const root = document.getElementById("root");
    root.innerHTML = OPTIONS.map(opt => `
      <section class="section" id="${opt.anchor}">
        <div class="section-head">
          <span class="pill ${opt.rec ? "rec" : ""}">Option ${opt.num}${opt.rec ? " · recommended" : ""}</span>
          <h2>${opt.title}</h2>
          <p>${opt.desc}</p>
        </div>
        <div class="row3">
          ${["night","day","manly"].map(tk => {
            const th = THEMES[tk];
            return `
              <div>
                <div class="frame-label">
                  ${th.label}
                  <span class="theme-tag" style="background:${th.tagBg};color:${th.tagFg}">${th.ACCENT}</span>
                </div>
                ${buildWin(tk, opt)}
              </div>`;
          }).join("")}
        </div>
      </section>
    `).join("");
  </script>
</body>
</html>
