[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Tests share module-level global caches and were authored one-file-per-process.
# run_tests.bat keeps that isolation by invoking pytest once per file.
addopts = -q --no-header -p no:cacheprovider

filterwarnings =
    default
